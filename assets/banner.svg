<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Astrosynx Monad Tools: read-only diagnostics for Monad nodes">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f5"/>
      <stop offset="1" stop-color="#a9aaad"/>
    </linearGradient>
  </defs>
  <style>
    .mono{font-family:ui-monospace,'IBM Plex Mono',SFMono-Regular,Consolas,monospace}
    .sans{font-family:Inter,'Helvetica Neue','Segoe UI',Arial,sans-serif}
    .rise{opacity:0;animation:rise .9s ease-out forwards}
    .r1{animation-delay:.1s}.r2{animation-delay:.3s}.r3{animation-delay:.5s}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .ln{opacity:0;animation:ln 9s steps(1) infinite}
    @keyframes ln{0%{opacity:0}8%{opacity:1}92%{opacity:1}100%{opacity:0}}
    .cur{animation:cur 1s steps(1) infinite}
    @keyframes cur{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.rise,.ln{opacity:1}}
  </style>

  <rect width="1200" height="360" fill="#0b0e12"/>

  <!-- top bar -->
  <g transform="translate(42 20)">
    <g fill="#6c6d70">
      <polygon points="6,2 12.5,2 20.3,28.5 13.8,28.5"/>
      <polygon points="19,10 25.3,10 33,28.5 26.7,28.5"/>
    </g>
    <g fill="none" stroke="url(#mark)" stroke-width="6.3" stroke-linecap="round">
      <line x1="3.6" y1="26.7" x2="6" y2="5.1"/>
      <line x1="16.8" y1="26.7" x2="21" y2="12.9"/>
      <line x1="30.9" y1="26.7" x2="33" y2="19.8"/>
    </g>
  </g>
  <text class="mono" x="92" y="43" font-size="15" letter-spacing="3" fill="#dedede">ASTROSYNX</text>
  <text class="mono" x="1160" y="42" text-anchor="end" font-size="11" letter-spacing="1.5" fill="#818284">SERVICES   KEYSTORES   SYNC   TRIEDB</text>
  <line x1="0" y1="70.5" x2="1200" y2="70.5" stroke="#303235"/>

  <!-- copy -->
  <g class="rise r1">
    <rect x="40" y="117" width="7" height="7" fill="#00d892"/>
    <text class="mono" x="56" y="124" font-size="11.5" letter-spacing="1.8" fill="#bababb">READ-ONLY NODE DIAGNOSTICS · MAINNET &amp; TESTNET</text>
  </g>
  <g class="rise r2">
    <image href="data:image/png;base64," x="40" y="150" width="54" height="54"/>
    <text class="sans" x="110" y="196" font-size="56" font-weight="400" letter-spacing="-1.2" fill="#dedede">Monad Tools</text>
  </g>
  <g class="rise r3">
    <text class="sans" x="40" y="252" font-size="16.5" fill="#818284">Four bash checks that catch service, keystore, sync and</text>
    <text class="sans" x="40" y="276" font-size="16.5" fill="#818284">TrieDB problems before consensus or RPC notices them.</text>
    <text class="mono" x="40" y="318" font-size="11.5" letter-spacing="1.6" fill="#818284">CHAIN ID  <tspan fill="#dedede">143</tspan>  ·  <tspan fill="#dedede">10143</tspan></text>
  </g>

  <!-- terminal -->
  <g transform="translate(700 100)">
    <rect x=".5" y=".5" width="459" height="219" fill="#181a1d" stroke="#303235"/>
    <line x1="0" y1="34.5" x2="460" y2="34.5" stroke="#303235"/>
    <g fill="#303235"><rect x="16" y="13" width="8" height="8"/><rect x="30" y="13" width="8" height="8"/><rect x="44" y="13" width="8" height="8"/></g>
    <text class="mono" x="66" y="22" font-size="10" letter-spacing="1.4" fill="#818284">monad@validator</text>

    <g class="mono" font-size="12.5">
      <text x="18" y="62" fill="#dedede"><tspan fill="#818284">$</tspan> bash node-health-check.sh</text>
      <text class="ln" x="18" y="88" fill="#bababb" style="animation-delay:.6s"><tspan fill="#00d892">✓</tspan> monad-bft is running</text>
      <text class="ln" x="18" y="108" fill="#bababb" style="animation-delay:1.1s"><tspan fill="#00d892">✓</tspan> monad-execution is running</text>
      <text class="ln" x="18" y="128" fill="#bababb" style="animation-delay:1.6s"><tspan fill="#00d892">✓</tspan> P2P port 8000 is listening</text>
      <text class="ln" x="18" y="148" fill="#bababb" style="animation-delay:2.1s"><tspan fill="#00d892">✓</tspan> RPC reachable (chain ID 143, mainnet)</text>
      <text class="ln" x="18" y="168" fill="#bababb" style="animation-delay:2.6s"><tspan fill="#00d892">✓</tspan> Disk space OK (41% free)</text>
      <text class="ln" x="18" y="196" fill="#00d892" style="animation-delay:3.2s">✓ Node health check passed <tspan class="cur" fill="#dedede">▍</tspan></text>
    </g>
    <rect x="300" y="-12" width="146" height="26" fill="#0b0e12" stroke="#303235"/>
    <rect x="312" y="-2" width="6" height="6" fill="#00d892"/>
    <text class="mono" x="326" y="5" font-size="10.5" letter-spacing="1.4" fill="#dedede">EXIT 0 · PASS</text>
  </g>

  <rect x=".5" y=".5" width="1199" height="359" fill="none" stroke="#303235"/>
</svg>
